name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content VNyanAdaptiveLighting.csproj
          $version = $proj.Project.PropertyGroup.Version | Where-Object { $_ }
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match project version $version" }

      - name: Fetch VNyan assemblies
        uses: actions/checkout@v4
        with:
          repository: LuunaVR/VNyan-Libs
          token: ${{ secrets.LIBS_TOKEN }}
          path: libs/VNyan

      - name: Build and test
        run: |
          dotnet build VNyanAdaptiveLighting.sln -c Release
          dotnet test VNyanAdaptiveLighting.sln -c Release --no-build

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\VNyanAdaptiveLighting.dll -DestinationPath "VNyanAdaptiveLighting-$env:GITHUB_REF_NAME.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: VNyanAdaptiveLighting-*.zip
          generate_release_notes: true
