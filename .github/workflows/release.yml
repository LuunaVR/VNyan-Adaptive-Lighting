name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch VNyan assemblies
        shell: pwsh
        env:
          VNYAN_LIBS_URL: ${{ secrets.VNYAN_LIBS_URL }}
        run: |
          if (-not $env:VNYAN_LIBS_URL) { throw 'Secret VNYAN_LIBS_URL is not set.' }
          $dir = Join-Path $PWD 'libs\VNyan\VNyan_Data\Managed'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest $env:VNYAN_LIBS_URL -OutFile libs.zip
          Expand-Archive libs.zip -DestinationPath $dir -Force

      - name: Build and test
        run: |
          dotnet build VNyanAdaptiveLighting.sln -c Release
          dotnet test VNyanAdaptiveLighting.sln -c Release --no-build

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\VNyanAdaptiveLighting.dll -DestinationPath VNyanAdaptiveLighting.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VNyanAdaptiveLighting.zip
            dist/VNyanAdaptiveLighting.dll
          generate_release_notes: true
