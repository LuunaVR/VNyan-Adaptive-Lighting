name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for an existing release
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content VNyanAdaptiveLighting.csproj
          $version = $proj.Project.PropertyGroup.Version | Where-Object { $_ }
          $tag = "v$version"
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "new=$((-not $exists).ToString().ToLower())" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.new == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Fetch VNyan assemblies
        if: steps.ver.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          repository: LuunaVR/VNyan-Libs
          token: ${{ secrets.LIBS_TOKEN }}
          path: libs/VNyan

      - name: Build and test
        if: steps.ver.outputs.new == 'true'
        run: |
          dotnet build VNyanAdaptiveLighting.sln -c Release
          dotnet test VNyanAdaptiveLighting.sln -c Release --no-build

      - name: Package
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\VNyanAdaptiveLighting.dll -DestinationPath "VNyanAdaptiveLighting-${{ steps.ver.outputs.tag }}.zip"

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: VNyanAdaptiveLighting-*.zip
          generate_release_notes: true
