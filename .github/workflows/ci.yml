name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch VNyan assemblies
        uses: actions/checkout@v4
        with:
          repository: LuunaVR/VNyan-Libs
          token: ${{ secrets.LIBS_TOKEN }}
          path: libs/VNyan

      - name: Build
        run: dotnet build VNyanAdaptiveLighting.sln -c Release

      - name: Test
        run: dotnet test VNyanAdaptiveLighting.sln -c Release --no-build
